name: CI pin policy pinned control
on:
  pull_request:
    branches: [codex/p04-05-policy-probe-base]
    paths: [.github/workflows/ci-pin-policy-pinned.yml]
permissions:
  contents: read
jobs:
  pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test -d .git
