name: Windows x64 build probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch pinned public Windows source
        run: |
          $sourceSha = 'e5801ae7f8788e2bb36fa58843ef31a691b19b8d'
          git init windows
          git -C windows remote add origin https://github.com/Iconic-University/ibrowser-windows.git
          git -C windows fetch --depth=1 origin $sourceSha
          git -C windows checkout --detach FETCH_HEAD
          if ((git -C windows rev-parse HEAD) -ne $sourceSha) {
            throw 'Windows source does not match the approved pin.'
          }

      - name: Restore and compile Debug x64
        working-directory: windows
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) {
            throw 'Visual Studio 2022 x64 MSBuild was not found.'
          }
          nuget restore SafeExamBrowser.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $msbuild SafeExamBrowser.sln /verbosity:minimal /property:LangVersion=latest /property:Configuration=Debug /property:Platform=x64

      - name: Run Debug x64 unit tests
        working-directory: windows
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -version '[17.0,18.0)' -products '*' -find 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) {
            throw 'Visual Studio 2022 VSTest was not found.'
          }

          $adapter = (Resolve-Path 'packages\MSTest.TestAdapter.4.4.1\buildTransitive\net462').Path
          $testProjects = Get-ChildItem 'SafeExamBrowser.*.UnitTests\*.csproj' -File
          if (-not $testProjects) {
            throw 'No unit test projects were found.'
          }
          $settings = Join-Path $env:RUNNER_TEMP 'windows-x64.runsettings'
          '<RunSettings><RunConfiguration><TreatNoTestsAsError>true</TreatNoTestsAsError></RunConfiguration></RunSettings>' | Set-Content $settings

          $failed = @()
          foreach ($project in $testProjects) {
            $assembly = Join-Path $project.DirectoryName "bin\x64\Debug\$($project.BaseName).dll"
            Write-Host "::group::$($project.BaseName)"
            & $vstest $assembly /Platform:x64 "/TestAdapterPath:$adapter" "/Settings:$settings" '/Logger:console;Verbosity=detailed'
            if ($LASTEXITCODE -ne 0) {
              $failed += $project.BaseName
            }
            Write-Host '::endgroup::'
          }

          if ($failed.Count -gt 0) {
            throw "Unit test projects with failures: $($failed -join ', ')"
          }
